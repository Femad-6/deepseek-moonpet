name: Verify MoonPet
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          clean: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - run: npm run check
      # 语音包生成器只用标准库，先查语法再跑自检，都不需要引擎或模型下载。
      - run: python3 -m py_compile scripts/make-voice-pack.py
      - run: python3 scripts/make-voice-pack.py --selftest
      - run: mkdir -p dist
      - run: npm run pack:release
