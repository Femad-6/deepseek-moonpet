<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="MoonPet">
  <defs>
    <linearGradient id="night" x2="1" y2="1"><stop stop-color="#293659"/><stop offset="1" stop-color="#121c35"/></linearGradient>
    <linearGradient id="moon" x2="0" y2="1"><stop stop-color="#fff0c2"/><stop offset="1" stop-color="#e9b96f"/></linearGradient>
    <linearGradient id="whale" x2="0" y2="1"><stop stop-color="#a5e5ff"/><stop offset="1" stop-color="#5999de"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#9ca8ff" stop-opacity=".23"/><stop offset="1" stop-color="#9ca8ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#night)"/>
  <rect x="9" y="9" width="238" height="238" rx="53" fill="none" stroke="#c1ccff" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="127" cy="132" r="99" fill="url(#halo)"/>
  <path d="M147 39a78 78 0 1 0 63 125 65 65 0 0 1-63-125Z" fill="url(#moon)"/>
